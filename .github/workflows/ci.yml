name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [25]
        scala: [3.3.8]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Java and SBT
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}

    - name: Setup SBT
      uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1

    - name: Cache SBT
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
          ~/.coursier/cache
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/plugins.sbt', 'project/build.properties') }}
        restore-keys: |
          ${{ runner.os }}-sbt-

    - name: Run tests
      run: sbt "++${{ matrix.scala }}; clean; coverage; test; coverageReport"

    - name: TestGlance
      if: always() && matrix.java == '25'
      uses: testglance/action@f88e74e6921f16a35258a44952e409b3f4a6bd91 # v1
      with:
        github-token: ${{ github.token }}
        report-path: '**/test-reports/TEST-*.xml'

    - name: Upload coverage reports to Codecov
      if: matrix.java == '25'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        files: ./target/out/jvm/scala-${{ matrix.scala }}/coding-interview-questions/scoverage-report/scoverage.xml
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Check formatting
      if: matrix.java == '25'
      run: sbt scalafmtCheckAll

